name: Test basic comment on issue
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "Hello from test"
          GITHUB_TOKEN: ${{ github.token }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action was invoked with required inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail because there is no real GitHub issue to comment on
          # in the act test environment, but we verify it was invoked with both inputs.
          # A 'failure' outcome means the action ran (inputs were accepted) but the
          # API call failed — which is expected in a local act environment.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with message and GITHUB_TOKEN inputs"
