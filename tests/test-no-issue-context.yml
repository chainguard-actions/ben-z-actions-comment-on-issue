name: Test comment-on-issue with no issue context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under workflow_dispatch, context.payload.issue is null, so the action
      # will call setFailed('No issue found.') — this is the expected behavior.
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "Hello from test"
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action failed gracefully with no issue context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no issue in workflow_dispatch payload)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (issue context was available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
